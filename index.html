<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="index.css">
</head>
    <body>
        <div class="app">
            <div class="header">
                <h1>Metric/Imperial Unit Conversion</h1>
                <input id="input-el">
                <button id="btn">Convert</button>
            </div>
            <div class="conversion">
                <div class="length">
                    <h2>Length(Meter/Feet)</h2>
                    <div id="length-el" class="result"></div>
                </div>
                <div class="volume">
                    <h2>Volume(Liters/Gallons)</h2>
                    <div id="volume-el" class="result"></div>
                </div>
                <div class="mass">
                    <h2>Mass(Kilograms/Pounds)</h2>
                    <div id="mass-el" class="result">
                    </div>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
